name: benchmark-ci

on:
  push:
    branches: [main, "oss/**", "oss-*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: benchmark-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate benchmark manifest
        run: python -m evaluator.manifest
      - name: Run test suite
        run: python -m pytest -q
      - name: Verify reference candidate
        run: python evaluator/runner.py --candidate reference --report-dir "${{ runner.temp }}/reports"
      - name: Exercise flawed candidate fixture
        run: python evaluator/runner.py --candidate flawed --report-dir "${{ runner.temp }}/reports"
