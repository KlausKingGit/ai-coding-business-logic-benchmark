name: benchmark-ci

on:
  push:
    branches: [main, "oss/**", "oss-*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: benchmark-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Verify dependency graph
        run: python -m pip check

      - name: Validate benchmark manifest
        run: python -m evaluator.manifest

      - name: Run test suite
        run: python -m pytest -q

      - name: Verify reference candidate
        run: |
          python evaluator/runner.py \
            --candidate reference \
            --report-dir "${{ runner.temp }}/reports" \
            --json-report "${{ runner.temp }}/reference.json"

      - name: Exercise flawed candidate fixture
        run: |
          python evaluator/runner.py \
            --candidate flawed \
            --report-dir "${{ runner.temp }}/reports" \
            --json-report "${{ runner.temp }}/flawed.json"

      - name: Validate fixture quality
        run: |
          python -m evaluator.fixture_check \
            --reference-json "${{ runner.temp }}/reference.json" \
            --flawed-json "${{ runner.temp }}/flawed.json"

  container-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build benchmark container
        run: docker build -f containers/Dockerfile -t ai-coding-business-logic-benchmark:ci .

      - name: Prepare external candidate fixture
        run: |
          mkdir -p "$RUNNER_TEMP/candidate"
          cp tasks/task_08_optimistic_concurrency/reference_solution.py \
            "$RUNNER_TEMP/candidate/task_08_optimistic_concurrency.py"

      - name: Run isolated candidate smoke test
        env:
          BENCHMARK_IMAGE: ai-coding-business-logic-benchmark:ci
          REPORT_DIR: $RUNNER_TEMP/container-reports
        run: |
          scripts/run_candidate_container.sh \
            "$RUNNER_TEMP/candidate" \
            container-smoke \
            --task task_08_optimistic_concurrency

      - name: Verify isolated result
        run: |
          python3 -c 'import json, os; p=json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "container-reports", "result.json"))); assert p["candidate"]["mode"] == "external"; assert p["summary"]["tasks"] == 1; assert p["summary"]["errors"] == 0; assert p["summary"]["score"] == 100'
