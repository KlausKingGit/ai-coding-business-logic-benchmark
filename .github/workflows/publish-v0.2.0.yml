name: publish-v0.2.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.2.0.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify release tag target
        run: |
          expected=755bd6d3027c395c8f8dc5190a913e68784dbc75
          actual=$(git rev-list -n1 v0.2.0)
          test "$actual" = "$expected"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.2.0 release already exists"
            exit 0
          fi
          gh release create v0.2.0 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "v0.2.0 — External Evaluation Harness" \
            --notes-file RELEASE_NOTES_v0.2.0.md
